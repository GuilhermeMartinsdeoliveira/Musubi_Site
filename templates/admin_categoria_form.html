<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Editar categoria' if categoria else 'Nova categoria' }} — Musubi Ateliê</title>
    <link rel="icon" href="{{ url_for('static', filename='assets/img/logo.jpg') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
    {% include '_header.html' %}
    <main class="admin-page">
        <div class="container admin-form-container">
            <a href="{{ url_for('admin_dashboard') }}" class="back-link"><i class="bi bi-arrow-left"></i> Voltar ao painel</a>
            <div class="form-heading"><span class="eyebrow">Organização</span><h1>{{ 'Editar categoria' if categoria else 'Nova categoria' }}</h1><p>Use nomes curtos e claros para facilitar a navegação na loja.</p></div>
            <form method="post" class="admin-form">
                {% if erro %}<div class="form-error"><i class="bi bi-exclamation-circle"></i>{{ erro }}</div>{% endif %}
                <label for="nome">Nome da categoria</label>
                <input type="text" id="nome" name="nome" maxlength="100" value="{{ categoria.nome if categoria else '' }}" required autofocus>
                <div class="form-actions"><a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar categoria</button></div>
            </form>
        </div>
    </main>
    {% include '_footer.html' %}
</body>
</html>
