<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Musubi Ateliê</title>

    <link rel="icon" href="{{ url_for('static', filename='assets/img/logo.jpg') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

    <div class="auth-topbar">
        <div class="container">
            <a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='assets/img/logo.jpg') }}" alt="Musubi"></a>
        </div>
    </div>

    <div class="auth-wrap">
        <div class="card card-auth mx-auto" style="max-width:560px;">
            <div class="card-body">

                <a href="{{ url_for('home') }}" class="auth-back"><i class="bi bi-arrow-left"></i> Voltar ao site</a>

                <div class="auth-header">
                    <h2>Criar Conta</h2>
                    <p>Preencha os dados para se cadastrar</p>
                </div>

                {% if erro %}
                <div class="auth-alert"><i class="bi bi-exclamation-circle"></i> {{ erro }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('cadastro') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sobrenome</label>
                            <input type="text" name="sobrenome" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="tel" name="telefone" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" name="confirmar_senha" class="form-control" required minlength="6">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" required>
                        <label class="form-check-label">Aceito os termos de uso</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

                    <div class="auth-footer-link">
                        Já possui conta?
                        <a href="{{ url_for('login') }}">Entrar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
